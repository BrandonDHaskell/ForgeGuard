name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forgeguard
          POSTGRES_USER: forgeguard
          POSTGRES_PASSWORD: forgeguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgeguard"
          --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn -B verify
        env:
          FORGEGUARD_JDBC_URL: jdbc:postgresql://localhost:5432/forgeguard
          FORGEGUARD_DB_USER: forgeguard
          FORGEGUARD_DB_PASSWORD: forgeguard
