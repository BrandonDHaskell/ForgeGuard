name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: forgeguard
          POSTGRES_USER: forgeguard
          POSTGRES_PASSWORD: forgeguard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgeguard"
          --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # The pytest tasks run `python -m pytest`, so `python` must have pytest.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Build fixture repo
        run: ./fixtures/build-fixtures.sh
      # The verification command runs `mvn -o`, so the fixture's own plugins and
      # test dependencies must already be in ~/.m2. The baseline has one failing
      # test by design, hence the ignore flag.
      - name: Warm the fixture dependency cache
        run: mvn -B -f /tmp/forgeguard-fixtures/intervals-java/pom.xml verify -Dmaven.test.failure.ignore=true
      - name: Build and test
        run: mvn -B verify
        env:
          FORGEGUARD_JDBC_URL: jdbc:postgresql://localhost:5432/forgeguard
          FORGEGUARD_DB_USER: forgeguard
          FORGEGUARD_DB_PASSWORD: forgeguard
      # Grades the harness against demo/expected.tsv; fails on any mismatch.
      - name: Demo against the answer key
        run: ./demo/run-all.sh
        env:
          FORGEGUARD_JDBC_URL: jdbc:postgresql://localhost:5432/forgeguard
          FORGEGUARD_DB_USER: forgeguard
          FORGEGUARD_DB_PASSWORD: forgeguard
