services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: forgeguard
      POSTGRES_USER: forgeguard
      POSTGRES_PASSWORD: forgeguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeguard"]
      interval: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
