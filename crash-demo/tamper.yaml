# Crash-and-reclaim demo copy of tasks/tamper.yaml with a 60s timeout, so a worker
# can run it with FORGEGUARD_MAX_TIMEOUT_SECONDS=60 and a 76s lease. Not in the
# answer key. Patch paths resolve against the repo root, like tasks/.
taskId: crash-intervals-tamper
repoUri: file:///tmp/forgeguard-fixtures/intervals-java
baseRef: v1.0
patchPath: fixtures/patches/tamper.patch
reportPath: fixtures/patches/tamper.report.json
image: maven:3.9-eclipse-temurin-21
strategy: maven
verifyCommand: ["mvn", "-B", "-o", "verify"]
limits:
  timeoutSeconds: 60
  memoryBytes: 2147483648
  cpus: 2.0
  pidsLimit: 256
  networkEnabled: false
protectedPaths:
  - "src/test/**"
  - "pom.xml"
